[project]
name = "sapient-quickstart"
version = "0.1.0"
description = "Copy-paste starting point for a SAPIENT ASM node built on sapient-sdk"
requires-python = ">=3.11"
dependencies = [
    "sapient-sdk",
    "python-dotenv>=1",
]

# This is an application, not a library -- there is nothing here to build
# into a wheel, just main.py to run directly.
[tool.uv]
package = false

[tool.uv.sources]
# sapient-sdk isn't published to PyPI yet, so it resolves from git. Once it
# is published, delete this table and pin a version instead
# (e.g. "sapient-sdk>=0.1.0" above).
sapient-sdk = { git = "https://github.com/cafanasyev/py-sapient-sdk", branch = "master" }
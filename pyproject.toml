[project]
name = "cafanasyev-sapient-sdk"
version = "0.1.0"
description = "Python SDK for BSI Flex 335 v2.0 SAPIENT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "cafanasyev-sapient-pydantic>=0.1.0",
    "python-ulid>=2",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "pytest-xdist>=3.8",
    "python-dotenv>=1",
    "ruff>=0.16",
    "trustme>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sapient_sdk"]

[tool.pytest.ini_options]
addopts = "-n auto"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples/quickstart"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
